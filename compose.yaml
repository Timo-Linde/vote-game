services:
  server:
    build: ./server
    ports:
      - "7071:7071"
    environment:
      - PORT=7071
      - ADMIN_NAME=Admin
      - DB_PATH=/data/games.db
    volumes:
      - games-db:/data
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  games-db:
